# Terms of art that mean the same thing to a court and different things to a
# search index.
#
# A researcher types "deficient notice"; the opinion says "defective", the
# statute says "failed to comply", and the treatise heads the section "Notice to
# Leave the Premises".  This file is the reviewed bridge between them, and it
# replaces the concept lists that used to sit in Python next to the scorer.
#
# A group is symmetric: every term in it expands to every other term.  Keep a
# group narrow.  "Rent" and "deposit" both involve money and belong in separate
# groups, because a group that is merely topical turns every query about one
# into a query about the other.
#
# Each group states its own verification, exactly as a court rule or a legal
# rule element list does:
#
#   verified    Checked against the cited authority by a person.
#   unverified  A starter grouping that has not been checked.
#
# Verification is reported with the results.  It does not suppress a group --
# an expansion only ever adds candidates, and every result says which of the
# reader's words it actually contains -- but a reader deciding whether a search
# was thorough is entitled to know which bridges were reviewed.
#
# The learned neighbour table built by `manage.py build_research_index` is the
# other half of expansion.  It is generated from corpus co-occurrence, carries
# no review, and is reported separately.  Curating a pairing here is how a
# reviewer overrides what the corpus happened to teach.
schema_version: 1

groups:
  - label: Eviction action
    verification: verified
    source: "Ohio Rev. Code Chapter 1923 (forcible entry and detainer)"
    terms:
      - eviction
      - evict
      - forcible entry and detainer
