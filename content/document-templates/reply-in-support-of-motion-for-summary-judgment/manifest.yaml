  instructions: []
  body: Once a moving party has identified the portions of the record showing that no genuine issue of
    material fact exists, the nonmoving party "may not rest upon the mere allegations or denials of the
    party's pleadings, but the party's response, by affidavit or as otherwise provided in this rule, must
    set forth specific facts showing that there is a genuine issue for trial." Civ.R. 56(E); Dresher v.
    Burt, 75 Ohio St.3d 280, 293, 662 N.E.2d 264 (1996). Argument in a brief is not evidence. An issue
    of fact is genuine only if it is supported by Civ.R. 56(C) material.
