  ai_latitude: guided
  ai_fill_mode: constrained_generation
  instructions: []
  body: '{% if dismissal_ground == "lack_of_subject_matter_jurisdiction" %}


    The standard for a Civ.R. 12(B)(1) motion is whether any cause of action cognizable by the forum has
    been raised in the complaint. State ex rel. Bush v. Spurlock, 42 Ohio St.3d 77, 80, 537 N.E.2d 641
    (1989). In deciding that question the court is not confined to the allegations of the complaint and
    may consider pertinent evidentiary material without converting the motion into one for summary judgment.
    Southgate Dev. Corp. v. Columbia Gas Transm. Corp., 48 Ohio St.2d 211, 358 N.E.2d 526 (1976), paragraph
    one of the syllabus. Whenever it appears that the court lacks jurisdiction of the subject matter,
    the court shall dismiss the action. Civ.R. 12(H)(3).


    {% else %}


    A motion to dismiss for failure to state a claim upon which relief can be granted tests the sufficiency
    of the complaint. State ex rel. Hanson v. Guernsey Cty. Bd. of Commrs., 65 Ohio St.3d 545, 548, 605
    N.E.2d 378 (1992). Dismissal is proper when it appears beyond doubt from the complaint that the plaintiff
    can prove no set of facts entitling the plaintiff to recovery. O''Brien v. Univ. Community Tenants
    Union, Inc., 42 Ohio St.2d 242, 327 N.E.2d 753 (1975), syllabus. The court presumes the complaint''s
    factual allegations are true and draws all reasonable inferences in the plaintiff''s favor, Mitchell
    v. Lawson Milk Co., 40 Ohio St.3d 190, 192, 532 N.E.2d 753 (1988), but it does not accept unsupported
    legal conclusions as true.


    {% endif %}'
