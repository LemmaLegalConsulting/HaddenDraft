  instructions: []
  body: '{% if dismissal_ground == "lack_of_subject_matter_jurisdiction" %}


    On a Civ.R. 12(B)(1) motion the question is whether the complaint raises any cause of action cognizable
    by the forum, and the court may consider pertinent evidentiary material in answering it. State ex
    rel. Bush v. Spurlock, 42 Ohio St.3d 77, 80, 537 N.E.2d 641 (1989); Southgate Dev. Corp. v. Columbia
    Gas Transm. Corp., 48 Ohio St.2d 211, 358 N.E.2d 526 (1976), paragraph one of the syllabus. A party''s
    characterization of that material in a brief does not supply the jurisdiction the complaint lacks.


    {% else %}


    A Civ.R. 12(B)(6) motion is decided on the complaint. The court may not rely on allegations or evidence
    outside the complaint in ruling on it. State ex rel. Fuqua v. Alexander, 79 Ohio St.3d 206, 207, 680
    N.E.2d 985 (1997). New factual assertions in a brief in opposition therefore cannot save a complaint
    that fails to state a claim.


    {% endif %}'
