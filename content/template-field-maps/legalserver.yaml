# WorkflowDocs support_legalserver.yml delegates these fields to LegalServerLink
# populate_client(). Paths below are relative to the v2 matter payload.
# Deliberately no mapping from LegalServer case_number to a court docket number.
source: WorkflowDocs support_legalserver.yml and LegalServerLink LSAPIs.populate_client
