  clients[0].name.middle: middle
  clients[0].name.last: last
  clients[0].name.suffix: suffix
  clients[0].name.text: organization_name
  clients[0].email: client_email_address
  clients[0].birthdate: date_of_birth
  clients[0].gender: client_gender
  clients[0].address.address: client_address_home.street
  clients[0].address.city: client_address_home.city
  clients[0].address.state: client_address_home.state
  clients[0].address.zip: client_address_home.zip
  clients[0].address.county: client_address_home.county
  client.name: client_full_name
  client_name: client_full_name
  defendant: client_full_name
  fields.client_name: client_full_name
  fields.client_email: client_email_address
  fields.client_phone: client_phone_number
  fields.client_first_name: first
  fields.client_last_name: last
  fields.client_address: client_address_home
