          directs the landlord to accept a tender, and it provides for no
          dismissal.  Two provisions are unusual and worth reading closely.
          § 763.01(b) writes emergency rental-assistance vouchers into the
          definition of "tender", but only where the agency "guarantees the
          payment of past due rent, reasonable late fees, and court costs" -- a
          conditional award may fall outside it.  § 763.06 applies the
          $25-or-5% late-fee cap only "to rental agreements entered into after
          the effective date of this section", so it does not reach an existing
          lease.
