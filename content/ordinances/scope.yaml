        citation: Worthington Codified Ordinances Ch. 727
        label: Pay to stay
        code_path: ["Part Seven — Business Regulation Code", "Chapter 727 — Pay to Stay"]
        citation_note: >-
          The chapter is titled "Tenant's Right to Assert Tender of Rent as an
          Affirmative Defense to Eviction", which is what it does; it is not a
          pay-to-stay right in the Cleveland Heights sense.
        act_file_number: Ord. 21-2023
        enacted_date: '2023-10-02'
        effective_date: '2023-10-26'
        related_statutes: ["1923.02", "1923.061", "5321.19"]
        treatise_chunks: ["0609-2-pay-to-stay-defense-in-eviction-actions-01"]
        source_type: signed_ordinance
        verification_urls:
          - https://codelibrary.amlegal.com/codes/worthington/latest/worthington_oh/0-0-0-41574
        notes: >-
          The narrowest chapter in this corpus.  It creates an affirmative
          defence and nothing else: no duty on the landlord to accept, no
          dismissal, no late-fee cap, no frequency limit, and no post-judgment
          window.  Tender by "an agency or individual on the tenant's behalf"
          is expressly covered.  One internal mismatch to read carefully --
          § 727.02(b) describes a tender of "all past due rent with reasonable
          late fees" before judgment, but makes the defence one of "all past due
          rent, reasonable late fees, and court costs"; the amounts named in the
          tender and in the defence do not match.
