# Reviewable scope for the Ohio local-law corpus.
#
# Local law is indexed by how much it can change the outcome of an eviction,
# not by codifying whole municipal codes.  Every target below names the
# authority, why it matters, and exactly how its text is acquired, so a reader
# can audit both the coverage and the provenance of what was ingested.
#
# Acquisition methods:
#   legistar  - the city's own legislative record through the public Legistar
#               Web API (https://webapi.legistar.com/v1/<client>/).  This yields
#               the enacted act, so records carry text_basis: enacted_act.
#   document  - one official document published by the city or the court at a
#               stable URL (PDF/DOCX/HTML).
#   pending   - the authority is declared and citable, but its text is not yet
#               acquirable by a permitted route.  Ohio's two commercial
#               codifiers both refuse automated retrieval: American Legal
#               Publishing serves a Cloudflare bot challenge, and Municode's
#               content API requires an authenticated token.  Those sites stay
#               citation targets (codifier_url), never scrape targets.  A
#               pending target is a visible gap, not a silent one.

source:
  name: Ohio municipal ordinances and local court rules
  jurisdiction: Ohio
  content_kind: ordinance
  update_note: >-
    Municipal code text changes without notice and codifiers republish on their
    own schedule.  A record generated here states the act it came from and the
    date it was retrieved; it never asserts that a chapter is current law.

# R.C. 5321.19 bars political subdivisions from regulating landlord/tenant
# rights already regulated by R.C. Chapter 5321, while expressly preserving
# local housing, building, health, and safety codes.  Every target carries a
# preemption block so research surfaces the question rather than an answer.
preemption_statute: "5321.19"

# Priority reflects how directly the authority can change an eviction outcome.
priorities:
  1:
    - pay-to-stay
    - rental-registration
    - housing-code
    - lead-safe
  2:
    - source-of-income
    - local-court-rule
    - right-to-counsel
    - nuisance
    - security-deposit
  3:
    - condemnation-relocation
    - utility-heat-water

topics:
  pay-to-stay:
    label: Pay-to-stay / right to cure
    why: Can defeat a nonpayment eviction outright when tender was refused.
    dataset: pay-to-stay
  late-fees:
    label: Limit on late payment fees
    why: Sets the "reasonable late fees" a pay-to-stay tender must cover.
  rental-registration:
    label: Rental registration, licensing, and occupancy certificates
    why: Noncompliance can bar a landlord from maintaining the eviction.
  housing-code:
    label: Municipal housing, building, health, and safety code
    why: Incorporated into landlord duties by R.C. 5321.04(A)(1) and into rent escrow by R.C. 5321.07.
  lead-safe:
    label: Lead-safe certification
    why: Creates certification duties, anti-retaliation rules, and sometimes eviction-specific protection.
  source-of-income:
    label: Source-of-income and expanded local fair housing
    why: Voucher and rental-assistance discrimination can create separate claims and defenses.
  local-court-rule:
    label: Local court rule or standing order
    why: Procedural requirements that decide filings, service, escrow, and dismissal.
  right-to-counsel:
    label: Right to counsel / access to legal services
    why: Determines representation eligibility and referral workflow.
  nuisance:
    label: Chronic nuisance and crime-free housing
    why: Generates lease-termination and eviction pressure from police calls.
  security-deposit:
    label: Security deposits and rental agreement terms
    why: Local limits on deposits and lease terms create claims and set-offs a tenant can raise.
  condemnation-relocation:
    label: Condemnation, relocation, and unsafe buildings
    why: Governs what a tenant is owed when code enforcement closes a unit.
  utility-heat-water:
    label: Local utility, heat, and water rules
    why: Strengthens habitability and constructive-eviction arguments.

