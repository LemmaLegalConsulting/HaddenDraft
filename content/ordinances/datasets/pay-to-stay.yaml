  - municipality: richmond-heights
    citation: Richmond Heights Codified Ordinances Ch. 763
    enacting_act: Ord. 81-2023, passed June 27, 2023
    shape_note: >-
      Affirmative defence only, and the narrowest late-fee cap in the corpus:
      § 763.06 reaches only rental agreements entered into after the section
      took effect, so it does not touch an existing lease.
    fields:
      tender_window:
        value: [before_filing, up_to_judgment]
        basis: ordinance-text
        source: richmond-heights-763
        note: §§ 763.02 and 763.03.  Nothing reaches past judgment.
      amounts_required:
        value: [rent, late_fees, court_costs]
        basis: ordinance-text
        source: richmond-heights-763
        note: >-
          Court costs are required only for a tender after filing.  § 763.01(c)
          defines them broadly -- filing, data entry, court appearances, service
          of summons and subpoenas, transcripts, and copying.
      late_fee_cap:
        value: greater of $25 or 5% of monthly contract rent, for leases entered after the effective date
        basis: ordinance-text
        source: richmond-heights-763
        note: >-
          The qualifier matters more than the figure.  § 763.06 closes with
          "This section shall only be applicable to rental agreements entered
          into after the effective date of this section", so a tenant on an
          older lease has no cap.
      rental_assistance_counts_as_tender:
        value: true
        basis: ordinance-text
        source: richmond-heights-763
        note: >-
          § 763.01(b) writes emergency rental-assistance vouchers into the
          definition of "tender", but only from an accredited social service,
          nonprofit, governmental or quasi-governmental agency and only where
          the voucher "guarantees the payment of past due rent, reasonable late
          fees, and court costs".  A conditional or partial award falls outside
          it.
      effect:
        value: affirmative_defense
        basis: ordinance-text
        source: richmond-heights-763
        note: >-
          Neither operative section directs the landlord to accept.  Both are
          written as: tender, refusal, defence.
      frequency_limit:
        value: none stated
        basis: ordinance-text
        source: richmond-heights-763
      partial_payment:
        value: unknown
        basis: ordinance-text
        source: richmond-heights-763
        note: The chapter is silent; every tender it describes is of the full amount due.
      dismissal:
        value: unknown
        basis: ordinance-text
        source: richmond-heights-763
        note: >-
          The chapter provides for no dismissal.  Disposition follows from the
          court sustaining the defence.

  - municipality: worthington
    citation: Worthington Codified Ordinances Ch. 727
    enacting_act: Ord. 21-2023, passed October 2, 2023, effective October 26, 2023
    shape_note: >-
      The narrowest chapter here.  Its title says what it is -- "Tenant's Right
      to Assert Tender of Rent as an Affirmative Defense to Eviction" -- and it
      creates a defence and nothing else: no duty to accept, no dismissal, no
      late-fee cap, no frequency limit, no post-judgment window.
    fields:
      tender_window:
        value: [before_filing, up_to_judgment]
        basis: ordinance-text
        source: worthington-727
        note: § 727.02(a) and (b).
      amounts_required:
        value: [rent, late_fees, court_costs]
        basis: ordinance-text
        source: worthington-727
        note: >-
          Read (b) carefully: it describes a tender of "all past due rent with
          reasonable late fees" before judgment, but makes the defence one of
          "all past due rent, reasonable late fees, and court costs".  What must
          be tendered and what the defence covers do not match on the face of
          the section.
      late_fee_cap:
        value: none stated
        basis: ordinance-text
        source: worthington-727
        note: >-
          The chapter requires "reasonable late fees" without defining the term
          or capping it, unlike every neighbouring chapter.
      rental_assistance_counts_as_tender:
        value: true
        basis: ordinance-text
        source: worthington-727
        note: >-
          Both divisions extend to a tender by "an agency or individual on the
          tenant's behalf".  § 727.01(c) defines tender as "the payment of
          rent", in any lawful form authorized by the rental agreement, city
          code, state law, or a court -- so an offer that is not payment may not
          qualify.
      effect:
        value: affirmative_defense
        basis: ordinance-text
        source: worthington-727
      frequency_limit:
        value: none stated
        basis: ordinance-text
        source: worthington-727
      partial_payment:
        value: unknown
        basis: ordinance-text
        source: worthington-727
      dismissal:
        value: unknown
        basis: ordinance-text
        source: worthington-727
        note: The chapter provides for no dismissal.

