  - municipality: akron
    citation: Akron Municipal Code § 150.51
    fields:
      tender_window:
        value: [before_filing, up_to_judgment]
        basis: ordinance-text
        source: akron-150-51
      amounts_required:
        value: [rent, late_fees, court_costs]
        basis: ordinance-text
        source: akron-150-51
        note: >-
          Court costs are required for a tender made after filing.  Attorney
          fees are expressly excluded: § 150.51(B)(1) states "Tenant shall not
          be responsible for landlord's attorney's fees."  A post-filing tender
          made through the court's escrow must also cover applicable escrow
          fees.
      late_fee_cap:
        value: greater of $25 or 8% of monthly contract rent
        basis: ordinance-text
        source: akron-150-52
        note: >-
          A five-percent figure circulates for Akron and is wrong as to current
          law: it comes from a reproduction headed "ORDINANCE NO. ____ -2021"
          with the number left blank, which is a pre-enactment draft.  The
          codified § 150.52 held here says "eight percent" and attributes the
          section to Ord. 111-2021; the treatise agrees.
      rental_assistance_counts_as_tender:
        value: true
        basis: ordinance-text
        source: akron-150-51
        note: >-
          Both divisions extend the defence to a tender by "someone or an agency
          on their behalf", which covers a rental-assistance payment.  The text
          does not say whether an agency's commitment to pay, as opposed to
          payment, is enough.  Smith v. Cade, No. 21-CVG-2160 (Akron Mun. Ct.
          May 12, 2021) ruled for a tenant whose tender came through a
          rental-assistance program.
      effect:
        value: affirmative_defense
        basis: ordinance-text
        source: akron-150-51
        note: >-
          Corrects an earlier reading of court_discretion taken from the
          treatise.  Akron differs from Cleveland Heights, Lakewood and Yellow
          Springs: § 150.51 never directs the landlord to accept a tender.  It
          only provides that refusal makes the attempted tender an affirmative
          defence, which the tenant must raise and the court then decides.
      frequency_limit:
        value: once per calendar year
        basis: ordinance-text
        source: akron-150-51
        note: >-
          § 150.51(C) limits the tenant to one use of the defence per calendar
          year, and preserves the tenant's other defences without that limit.
          The defences are available to residential tenants only.
      partial_payment:
        value: not accepted after filing
        basis: ordinance-text
        source: akron-150-51
        note: >-
          The escrow route in § 150.51(B)(1) requires "a payment in full,
          including all past due rent with reasonable late fees, court costs,
          and applicable escrow fees", deposited before the date of trial.  The
          section is silent on partial payment before filing.
      dismissal:
        value: unknown
        basis: ordinance-text
        source: akron-150-51
        note: >-
          The section says nothing about dismissal.  It creates a defence to the
          action rather than a duty to dismiss, so the disposition follows from
          the court sustaining the defence.  An earlier "discretionary" value
          here was read from the treatise, not from the section.

