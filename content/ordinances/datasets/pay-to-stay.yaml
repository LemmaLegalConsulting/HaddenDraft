# Pay-to-stay as a set of answered questions, not a boolean.
#
# Whether a city "has pay-to-stay" tells an advocate almost nothing.  What
# decides a live case is when tender may be made, what it must cover, whether a
# rental-assistance guarantee counts, and whether the court must dismiss.  Those
# are the fields below.
#
# Every field carries where its answer came from and how far it can be trusted:
#
#   basis: ordinance-text  - read from ingested text of the ordinance itself
#          transcription   - read from hand-supplied text that nobody has yet
#                            verified against a publisher's copy.  As specific
#                            as ordinance-text and as unconfirmed as a rumour;
#                            it gets its own rung so the difference survives.
#          treatise        - stated in the indexed treatise section named in `source`
#          secondary       - a compilation or advocacy source; a lead, not authority
#          unknown         - not yet established; the field is open, not absent
#
# `unknown` is a first-class answer.  A missing field would read as "no such
# limit"; an unknown one reads as "nobody has checked", which is the truth and
# is what an advocate needs to know before relying on it.

schema_version: 1
dataset: pay-to-stay
title: Ohio pay-to-stay ordinances
jurisdiction: Ohio

# The value vocabularies a reader (and the UI) can rely on.
vocabularies:
  tender_window:
    before_filing: Tender before the eviction action is filed.
    after_filing: Tender after filing but before judgment.
    up_to_judgment: Tender any time up to entry of the eviction judgment.
    before_writ_executed: Tender after judgment but before the writ of restitution is executed.
  amounts_required: [rent, late_fees, court_costs, attorney_fees, writ_costs]
  effect:
    landlord_must_accept: The landlord is required to accept the tender.
    affirmative_defense: Refusal creates an affirmative defense; acceptance is not compelled.
    court_discretion: The court decides case by case whether the defense applies.
  dismissal:
    mandatory: Dismissal (or vacatur and dismissal) is required on a qualifying tender.
    discretionary: Dismissal rests with the court.

