  - municipality: euclid
    citation: Euclid Codified Ordinances Ch. 1765
    enacting_act: Ord. 60-2021, passed May 3, 2021; made permanent by Ord. 125-2022
    shape_note: >-
      Reaches past judgment to execution of the writ and stops the bailiff
      pending an emergency hearing, the same shape as Lakewood and Yellow
      Springs.
    caveat: >-
      Euclid's comparative section table attributes §§ 1765.01 to 1765.08 to
      Ord. 60-2021, but the accessible code rendering exposes no § 1765.08.
      Nothing below rests on that section, and nothing here reconstructs it.
    fields:
      tender_window:
        value: [before_filing, up_to_judgment, before_writ_executed]
        basis: ordinance-text
        source: euclid-1765
        note: >-
          §§ 1765.02, 1765.03, and 1765.04.  On a refused post-judgment tender
          the bailiff "shall not enforce the eviction judgment" until the court
          so instructs after an emergency hearing.
      amounts_required:
        value: [rent, late_fees, court_costs, writ_costs]
        basis: ordinance-text
        source: euclid-1765
        note: >-
          A post-judgment tender must also cover the cost of obtaining the writ.
          § 1765.01 defines court costs broadly and does not mention attorney
          fees.
      late_fee_cap:
        value: greater of $25 or 5% of contracted monthly rent
        basis: ordinance-text
        source: euclid-1765
        note: >-
          § 1765.07 also bars a landlord from charging any late fee that is not
          a "reasonable late fee", so the cap is a ceiling on what the term can
          mean rather than only a limit on the charge.
      rental_assistance_counts_as_tender:
        value: unknown
        basis: ordinance-text
        source: euclid-1765
        note: >-
          § 1765.01 defines tender as an offer of payment "equivalent to the
          actual production or remittance of the money", which is narrower than
          the Lakewood and Richmond Heights voucher clauses and says nothing
          about an agency paying on the tenant's behalf.
      effect:
        value: landlord_must_accept
        basis: ordinance-text
        source: euclid-1765
        note: >-
          The landlord "shall accept" before filing and "must accept" after.
          Refusal is separately an affirmative defence.
      frequency_limit:
        value: none stated
        basis: ordinance-text
        source: euclid-1765
      partial_payment:
        value: unknown
        basis: ordinance-text
        source: euclid-1765
      dismissal:
        value: mandatory
        basis: ordinance-text
        source: euclid-1765
        note: >-
          After filing the landlord "shall dismiss".  After judgment the
          landlord must notify the court, which vacates and dismisses; where the
          landlord refused, the court does the same after the emergency hearing.

