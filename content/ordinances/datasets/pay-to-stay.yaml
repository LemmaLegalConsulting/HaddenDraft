        source: yellow-springs-868
        note: >-
          The landlord "shall accept" a pre-filing tender and "must accept" one
          after filing.  Refusal is separately made an affirmative defence, so
          the duty and the defence both apply.
      frequency_limit:
        value: none stated
        basis: ordinance-text
        source: yellow-springs-868
        note: >-
          The chapter carries no per-year or per-tenancy limit, unlike Akron
          § 150.51(C).
      partial_payment:
        value: unknown
        basis: ordinance-text
        source: yellow-springs-868
        note: >-
          The chapter is silent.  Every tender it describes is of the full
          amount then due.
      dismissal:
        value: mandatory
        basis: ordinance-text
        source: yellow-springs-868
        note: >-
          On a qualifying tender after filing the landlord "shall dismiss".
          After judgment the landlord must notify the court, which vacates the
          judgment and dismisses; where the landlord refused the tender the
          court does the same after the emergency hearing.

  - municipality: lakewood
    citation: Lakewood Codified Ordinances § 516.22
    enacting_act: Ord. 02-2023, passed February 6, 2023
    shape_note: >-
      The only ordinance in this corpus that reaches past judgment all the way
      to execution of the writ, and the only one that stops the bailiff pending
      an emergency hearing on a refused tender.
    caveat: >-
      Every field below rests on a hand-supplied transcription that no publisher
      copy has confirmed.
    fields:
      tender_window:
        value: [before_filing, up_to_judgment, before_writ_executed]
        basis: transcription
        source: lakewood-516-22
        note: >-
          Divisions (a), (b), and (c) respectively: before filing, before
          judgment, and after judgment but before the writ is executed.
      amounts_required:
        value: [rent, late_fees, court_costs, writ_costs]
        basis: transcription
        source: lakewood-516-22
        note: A post-judgment tender must also cover the cost of obtaining the writ.
      late_fee_cap:
        value: greater of $25 or 5% of monthly contract rent
        basis: transcription
        source: lakewood-516-22
        note: Division (e), stated in the section itself rather than by cross-reference.
      rental_assistance_counts_as_tender:
        value: true
        basis: transcription
        source: lakewood-516-22
        note: >-
          Division (d) counts vouchers from an accredited government,
          quasi-government, or nonprofit entity that are "redeemable or
          convertible on demand without condition into legal tender".  A
          conditional or slow-paying award may fall outside that.
      effect:
        value: landlord_must_accept
        basis: transcription
        source: lakewood-516-22
        note: >-
          "the landlord shall accept" / "must accept" at every stage, with
          refusal also creating an affirmative defense.
      frequency_limit:
        value: none stated
        basis: transcription
        source: lakewood-516-22
      partial_payment:
        value: unknown
        basis: unknown
        note: The section speaks of tendering "all past due rent"; partial tender is not addressed.
      dismissal:
        value: mandatory
        basis: transcription
        source: lakewood-516-22
        note: >-
          Pre-judgment, the landlord "shall dismiss".  Post-judgment the court
          vacates and dismisses, and on a refused tender the bailiff may not
          enforce until an emergency hearing has been held.

  - municipality: columbus
    citation: Columbus City Codes § 4551.06
    enacting_act: Ordinance 2108-2023
    shape_note: >-
      Columbus regulates *who* may pay rather than *when* a tenant may cure.
      Treating it as an ordinary pay-to-stay ordinance would overstate it.
    fields:
      tender_window:
        value: unknown
        basis: ordinance-text
        source: columbus-4551-06
        note: The section sets no window; it governs refusal of a third party's tender.
      amounts_required:
        value: unknown
        basis: ordinance-text
        source: columbus-4551-06
      late_fee_cap:
        value: unknown
        basis: unknown
      rental_assistance_counts_as_tender:
        value: true
        basis: ordinance-text
        source: columbus-4551-06
        note: >-
          The rule is about the payer, not the source of funds: an operator may
          not refuse tender because someone other than the tenant proffered it.
      effect:
        value: landlord_must_accept
        basis: ordinance-text
        source: columbus-4551-06
        note: >-
          Refusal is a fourth-degree misdemeanor, and the attempted third-party
          tender is an affirmative defense in an eviction for nonpayment.
      frequency_limit:
        value: unknown
        basis: unknown
      partial_payment:
        value: unknown
        basis: unknown
      dismissal:
        value: unknown
        basis: unknown
    caveat: >-
      Division (b) excludes a tenant "in default on the payment of rent" from
      the duty to accept.  Read literally that is most nonpayment evictions, so
      the reach of the defense in a live case is contested rather than settled.

