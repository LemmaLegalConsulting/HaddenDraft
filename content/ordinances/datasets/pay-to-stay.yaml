  - municipality: cleveland
    citation: Cleveland Codified Ordinances § 375.13
    enacting_act: Ordinance No. 484-2022
    fields:
      tender_window:
        value: [before_filing, up_to_judgment]
        basis: ordinance-text
        source: cleveland-375-13
        note: >-
          § 375.13(b) covers tender before filing; § 375.13(c) covers tender
          before judgment, and lets the tenant satisfy it by paying into escrow
          with the Cleveland Municipal Housing Court before the trial date.
      amounts_required:
        value: [rent, late_fees, court_costs]
        basis: ordinance-text
        source: cleveland-375-13
        note: >-
          Court costs are required only for a tender after filing.  An escrowed
          tender must also cover applicable escrow fees.
      late_fee_cap:
        value: greater of $25 or 5% of monthly contract rent
        basis: ordinance-text
        source: cleveland-375-02
        note: >-
          § 375.13 defines "reasonable late fees" by reference to § 375.02(c),
          whose text is now held from Cleveland's own City Record: the fee "may
          not exceed the larger of: (i) twenty-five dollars ($25.00); or (ii)
          five percent (5%) of the monthly contract rent", and separately may
          not exceed twenty-five percent of the portion of the contract rent the
          tenant is obligated to pay.  That second cap is what bites for a
          subsidized tenant paying a small share of the rent.
      rental_assistance_counts_as_tender:
        value: true
        basis: ordinance-text
        source: cleveland-375-13
        note: >-
          "Tender ... includes any emergency rental assistance vouchers from an
          accredited social service, nonprofit, governmental, or
          quasi-governmental agency that guarantees the payment of past due
          rent, reasonable late fees, and court costs."  A guarantee counts, so
          approved-but-undisbursed assistance is tender.
      effect:
        value: affirmative_defense
        basis: ordinance-text
        source: cleveland-375-13
        note: Refusal creates a defense; the act does not compel acceptance.
      frequency_limit:
        value: unknown
        basis: unknown
      partial_payment:
        value: unknown
        basis: unknown
        note: The act speaks of tendering "all past due rent"; partial tender is not addressed.
      dismissal:
        value: unknown
        basis: unknown
        note: The remedy is a defense to the action, not a stated dismissal duty.

