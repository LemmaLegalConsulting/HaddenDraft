# The shape of a municipality nobody has examined yet.  Named once so a new
# record starts honest instead of starting empty.
field_templates:
  # The shape the treatise describes for the ordinances where a qualifying
  # tender is a right rather than a discretionary defense.
  right_not_discretion: &right_not_discretion
    tender_window:
      value: [before_filing, up_to_judgment, before_writ_executed]
      basis: treatise
      source: treatise-pay-to-stay
    amounts_required:
      value: [rent, late_fees, court_costs, writ_costs]
      basis: treatise
      source: treatise-pay-to-stay
      note: >-
        A post-judgment tender before the writ is executed must also cover the
        cost of the writ of restitution.
    late_fee_cap:
      value: unknown
      basis: unknown
    rental_assistance_counts_as_tender:
      value: unknown
      basis: unknown
    effect:
      value: landlord_must_accept
      basis: treatise
      source: treatise-pay-to-stay
    frequency_limit:
      value: unknown
      basis: unknown
    partial_payment:
      value: unknown
      basis: unknown
    dismissal:
      value: mandatory
      basis: treatise
      source: treatise-pay-to-stay
      note: >-
        On a qualifying post-judgment tender the landlord must dismiss, or
        notify the court to vacate the judgment and dismiss.
  unexamined: &unexamined
    tender_window: {value: unknown, basis: unknown}
    amounts_required: {value: unknown, basis: unknown}
    late_fee_cap: {value: unknown, basis: unknown}
    rental_assistance_counts_as_tender: {value: unknown, basis: unknown}
    effect: {value: unknown, basis: unknown}
    frequency_limit: {value: unknown, basis: unknown}
    partial_payment: {value: unknown, basis: unknown}
    dismissal: {value: unknown, basis: unknown}

