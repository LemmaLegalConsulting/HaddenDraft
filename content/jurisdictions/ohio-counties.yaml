# Ohio's counties, as one controlled vocabulary.
#
# Metadata reaches this application from documents rather than from a list, so
# the same county arrives as "Cuyahoga" on one decision and "Cuyahoga County"
# on the next.  Left alone that splits a shelf in two: a reader who narrows to
# one of the spellings is told there are 126 cases when there are 264, and the
# half they were not shown is invisible rather than merely unselected.
#
# So this file is the vocabulary, and `apps.core.jurisdictions` is the only
# thing that reads it.  Ingestion writes the canonical name, so new material is
# consistent on the way in; browsing and research canonicalize again as they
# read, so material imported before this existed groups correctly too.
#
# A value that does not match a county here is left exactly as it arrived.
# That matters more than it sounds: this corpus contains "Miami-Dade County"
# and "Durham County, North Carolina", and an out-of-state county quietly
# rewritten to an Ohio one would put a Florida decision on an Ohio shelf.
# `manage.py normalize_case_counties --report` lists what did not match, so a
# gap in this file is visible rather than silent.
#
# Each entry carries the appellate district that reviews the county, which is
# also a published fact rather than a judgement, so the district facet is
# looked up here instead of guessed from a court name.
#
# `aliases` is for a spelling that mechanical normalization cannot reach --
# a historical name, a misspelling the corpus actually contains.  Case,
# punctuation, a trailing "County"/"Cty."/"Co.", a leading "County of" and a
# trailing state name are handled in code and need no entry here.
schema_version: 1
verification: verified
source: >-
  County names as the Ohio Secretary of State lists them; appellate districts
  per Ohio Rev. Code 2501.01.
source_url: "https://codes.ohio.gov/ohio-revised-code/section-2501.01"
verified_on: "2026-09-21"
state: Ohio

