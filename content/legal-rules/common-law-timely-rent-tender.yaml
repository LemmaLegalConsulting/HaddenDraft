slug: common-law-timely-rent-tender
name: Timely full tender of rent refused
citation: Pinewood Gardens Apts. v. Whiteside, 2014-Ohio-2305
rule_type: doctrine
jurisdiction: Ohio
summary: A landlord may not refuse timely full rent, including during an applicable grace period, and then evict for nonpayment of that rent.
citation_patterns: ["Pinewood Gardens.{0,30}Whiteside", "2014-Ohio-2305", "Professional Invs?.{0,30}Ross"]
aliases: [timely tender of rent, refused rent payment, vain act]
verification: verified
source: "Iskin (6th ed. 2022), § II.J-K; Pinewood Gardens Apts. v. Whiteside, 2014-Ohio-2305; Professional Investments of America, Inc. v. Ross, No. 44540, 1982 WL 2579"
source_url: ""
verified_on: 2026-09-13
notes: Timely full tender is the verified rule. Excused tender as a vain act is fact-dependent and is not encoded as an alternative required element here.
