schema_version: 1
slug: rc-5321-04-landlord-duties
name: Landlord obligations
citation: R.C. 5321.04
rule_type: statute
jurisdiction: Ohio
summary: >-
  A residential landlord owes statutory duties including compliance with
  building, housing, health, and safety codes and keeping the premises in a fit
  and habitable condition. A tenant relying on a breach must identify the
  applicable statutory duty and the concrete conduct or condition breaching it;
  the elements of a particular remedy are audited under that remedy's rule.

citation_patterns:
  - "R\\.?\\s*C\\.?\\s*(§\\s*)?5321\\.04"
  - "O\\.?R\\.?C\\.?\\s*(§\\s*)?5321\\.04"
  - "section 5321\\.04"
aliases:
  - landlord's statutory duties
  - duty to repair
  - fit and habitable
  - warranty of habitability

verification: verified
source: "R.C. 5321.04; Iskin (6th ed. 2022), §§ VII, IX-X"
source_url: https://codes.ohio.gov/ohio-revised-code/section-5321.04
verified_on: 2026-09-13
notes: >-
  Notice and a repair opportunity are not universal elements of the statutory
  duty itself; particular remedies may add them. Entry claims under division B
  have conditional elements below.

elements:
  - id: duty_identified
    label: The specific statutory duty is identified
    requirement: The brief names which obligation was breached, not just that conditions were bad.
    severity: error
    needs_record_support: false
    patterns:
      - "5321\\.04\\s*\\(A\\)\\s*\\(\\d"
      - "(building|housing|health|safety) code"
      - "fit and habitable"
  - id: condition_described
    label: The condition is described specifically
    requirement: The brief describes the defect, where it is, and how long it lasted.
    severity: error
    needs_record_support: true
    patterns:
      - "(leak|mold|heat|furnace|water|infestation|roach|rodent|electrical|plumbing|roof)"
  - id: entry_without_reasonable_notice
    label: Nonemergency entry lacked reasonable notice or occurred at an unreasonable time
    requirement: Identify the entry demand notice timing and circumstances; twenty-four hours is presumptively reasonable absent contrary evidence.
    severity: error
    needs_record_support: true
    required_when: Only if the brief asserts an entry claim under R.C. 5321.04(A)(8) or (B).
    patterns:
      - "(entry|enter).{0,50}(notice|reasonable time)"
      - "twenty-four hours"
  - id: entry_harm_or_relief
    label: Division B harm or authorized relief is pleaded
    requirement: Connect the improper entry or repeated harassing demands to actual damages injunctive relief fees or termination.
    severity: error
    needs_record_support: true
    required_when: Only if the brief seeks relief under R.C. 5321.04(B).
    patterns:
      - "actual damages"
      - "injunctive relief"
      - "harass.{0,30}(entry|tenant)"
  - id: consequence_claimed
    label: The statutory breach is connected to an available remedy or defense
    requirement: Identify the particular claim or defense and its remedy-specific legal basis rather than assuming every R.C. 5321.04 breach automatically defeats possession.
    severity: warning
    needs_record_support: false
    required_when: Only if the brief seeks relief or asserts an eviction defense based on the R.C. 5321.04 breach.
    patterns:
      - "\\b(rent abatement|abatement of (the )?rent)\\b"
      - "damages"
      - "defense to (possession|eviction)"
      - "rent escrow"
