slug: rc-1923-04-waiver-rent
name: Waiver of notice to vacate by acceptance of future rent
citation: Associated Estates Corp. v. Bartell, 24 Ohio App.3d 6 (8th Dist. 1985)
rule_type: doctrine
jurisdiction: Ohio
summary: Acceptance after an R.C. 1923.04 notice of rent attributable to a future occupancy period waives that notice; acceptance of only past-due rent does not.
citation_patterns: ["Associated Estates.{0,30}Bartell", "24 Ohio App\\.?3d 6", "Presidential Park.{0,30}Colston"]
aliases: [waiver of notice, accepted rent after notice, acceptance of future rent]
verification: verified
source: "Iskin, Ohio Eviction and Landlord-Tenant Law (6th ed. 2022), § II.C.1; Associated Estates Corp. v. Bartell, 24 Ohio App.3d 6, 492 N.E.2d 841 (8th Dist. 1985)"
source_url: ""
verified_on: 2026-09-13
notes: Future-rent attribution is essential. The profile does not treat acceptance of only past-due rent as waiver.
