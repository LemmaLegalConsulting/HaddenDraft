schema_version: 1
slug: rc-1923-04-notice
name: Notice to leave the premises
citation: R.C. 1923.04
rule_type: statute
jurisdiction: Ohio
summary: >-
  A forcible entry and detainer action requires that the party seeking
  possession first serve a notice to leave the premises, in the statutory form
  and by a permitted method, and then wait the statutory period before filing.

citation_patterns:
  - "R\\.?\\s*C\\.?\\s*(§\\s*)?1923\\.04"
  - "O\\.?R\\.?C\\.?\\s*(§\\s*)?1923\\.04"
  - "section 1923\\.04"
aliases:
  - three-day notice
  - three day notice
  - notice to leave the premises
  - notice to vacate

verification: verified
source: "R.C. 1923.04; Iskin, Ohio Eviction and Landlord-Tenant Law (6th ed. 2022), § I.C"
source_url: https://codes.ohio.gov/ohio-revised-code/section-1923.04
verified_on: 2026-09-13
notes: >-
  The ordinary-mail addition applies only to a deceased manufactured-home-park
  resident under division (C). This profile audits the general division (A)
  route and treats statutory exceptions as conditional.

# The issue-selection row contributes maintained intake facts alongside the
# source-specific statutory requirements below.
decision_table_key: eviction_answer_issue_selection
decision_table_row: notice_defect

elements:
  - id: notice_served
    label: A notice to leave the premises was served
    requirement: The brief identifies a notice and says it was served on the tenant.
    severity: error
    needs_record_support: true
    required_when: The brief asserts compliance with R.C. 1923.04 or specifically claims notice was not served.
    patterns:
      - "serv(ed|ice) .{0,60}notice"
      - "notice .{0,40}(was|were) serv"
  - id: statutory_language
    label: The notice carried the language the statute requires
    requirement: >-
      The brief says whether the notice contained the statutorily required
      language, and quotes or attaches it rather than characterizing it.
    severity: error
    needs_record_support: true
    required_when: The brief asserts compliance with R.C. 1923.04 or specifically challenges the notice's statutory language.
    patterns:
      - "statutory language"
      - "required language"
      - "language required by"
  - id: service_method
    label: The notice was served by a permitted method
    requirement: The brief names how the notice was delivered.
    severity: warning
    needs_record_support: true
    required_when: The brief asserts compliance with R.C. 1923.04 or specifically challenges the manner of service.
    patterns:
      - "(personal|residential|certified) (service|mail)"
      - "posted (on|at) the"
      - "hand[- ]deliver"
  - id: special_route
    label: Any claimed statutory alternative or deceased-resident route is satisfied
    requirement: Apply division B or C exactly, including added posting and ordinary-mail recipients for a deceased manufactured-home-park resident.
    severity: error
    needs_record_support: true
    required_when: Only if the brief relies on an alternative in division B or the adverse party is a deceased manufactured-home-park resident under division C.
    patterns:
      - "5313\\.06"
      - "5321\\.17\\(C\\)"
      - "deceased.{0,40}(resident|tenant)"
  - id: waiting_period
    label: The statutory period ran before the complaint was filed
    requirement: >-
      The brief gives both the service date and the filing date, so the period
      between them can be counted rather than assumed.
    severity: error
    needs_record_support: true
    required_when: The brief asserts compliance with R.C. 1923.04 or specifically challenges the interval between service and filing.
    patterns:
      - "filed .{0,60}(after|before) .{0,40}notice"
      - "three days"
      - "(service|notice) date"
