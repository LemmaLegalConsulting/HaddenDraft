schema_version: 1
slug: rc-5321-11-notice-to-cure
name: Notice for tenant breach materially affecting health and safety
citation: R.C. 5321.11
rule_type: statute
jurisdiction: Ohio
summary: For covered R.C. 5321.05 breaches materially affecting health and safety, the written notice must specify the noncompliant act or omission and a termination date at least thirty days after receipt; timely remedy prevents termination.
citation_patterns: ["R\\.?\\s*C\\.?\\s*(§\\s*)?5321\\.11", "section 5321\\.11"]
aliases: [thirty-day notice to cure, 30-day notice to cure, notice of breach of obligation]
verification: verified
source: "R.C. 5321.11; Iskin (6th ed. 2022), §§ I.D.2, II.A.2, II.F"
source_url: https://codes.ohio.gov/ohio-revised-code/section-5321.11
verified_on: 2026-09-13
notes: The statute does not require the notice itself to recite a right-to-cure advisement; it provides that failure to remedy causes termination.
