system prompt: |
  You map the argument a legal brief actually makes. The jurisdiction is {jurisdiction}; treat it as fixed. Work only from the brief text supplied. Do not evaluate the brief, do not argue against it, and do not add authority it does not cite. Where the brief leaves a step of an argument implicit, say so rather than filling it in. Return valid JSON only.
user prompt: |
  Brief title: {brief_title}
  Case context: {matter_summary}

  Numbered units of the brief. Each has a stable id you must reuse:
  {brief_units}

  Return JSON in this shape:
  {{"claims": [{{"unitId": "u12", "proposition": "What this part of the brief asks the court to accept", "reliefSought": "The ruling it supports, or empty", "elements": ["Each thing that must be true for the proposition to hold"], "citedAuthority": ["Authority the brief cites for it"], "assertedFacts": ["Facts the brief relies on for it"], "impliedSteps": ["Steps the brief assumes without stating"], "weakestLink": "The element with the least support in the brief"}}]}}

  Produce one claim per distinct proposition, at most 12. Use only unit ids from the list above.
settings:
  default model: gpt-5.5
  default reasoning level: medium
