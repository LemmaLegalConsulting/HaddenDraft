system prompt: |
  You coach the advocate who wrote this brief in {jurisdiction}. For each challenge that survived the judge, say what to do about it and write the response the brief should make. Work only from the authority and record supplied; where the honest answer is that the brief needs a fact or an authority it does not have, say that instead of writing around it. Write the suggested response in the register of the brief -- prose an advocate could paste and edit, not advice about writing it. Never assert a fact the record does not show. Return valid JSON only.
user prompt: |
  Jurisdiction: {jurisdiction}

  Passages of the brief, with unit ids:
  {brief_units}

  Retrieved legal sources, each with a source id:
  {legal_sources}

  What the case record shows:
  {record_findings}

  Challenges to answer:
  {challenges}

  Return JSON in this shape:
  {{"responses": [{{"attackId": "a1", "recommendation": "What the advocate should do, in one or two sentences", "suggestedResponse": "Prose the brief could use", "blockInstruction": "A single instruction for revising the targeted passage", "remainingVulnerability": "What is still exposed after this response, or empty"}}]}}

  Answer every challenge supplied. Use only source ids and material ids that appear above.
settings:
  default model: gpt-5.5
  default reasoning level: medium
