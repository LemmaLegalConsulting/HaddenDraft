server {
    listen 80;
    server_name _;

    # Letterhead and template DOCX uploads go through Django admin and routinely
    # exceed nginx's 1m default, which would reject them as 413 before Django
    # ever saw the request.
    client_max_body_size 50m;

    # Container Apps probes this. Answering from nginx keeps the SPA fallback
    # from returning 200 for a probe when the app itself is broken.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Serve the React Vite frontend
    location / {
        root /app/frontend/dist;
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to Django
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Proxy admin requests to Django
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Serve Django static files (admin panel, etc)
    location /static/ {
        alias /app/backend/staticfiles/;
    }

    # Serve Django media files if needed
    location /media/ {
        alias /app/media/;
    }
}
