  - fixture_id: F007
    case_family_id: estate-of-anthony-notarian-v-notarian--23m000467
    source_file: "PLAINTIFF'S MOTION FOR PARTIAL SUMMARY JUDGMENT FILED. PO.docx"
    stratum: trial_eviction
    document:
      title: "Plaintiff's Motion for Partial Summary Judgment"
      court: "Court of Common Pleas of Ohio, Geauga County"
      jurisdiction: "Ohio"
      pleading_type: "motion_summary_judgment"
      side: "plaintiff"
      filed: "2024-01-25"
    mutation:
      type: record_support
      subtype: manner_of_service_contradicted_by_the_attached_notice_and_affidavit
      operation: replace
      section: "III.C -- compliance with R.C. 1923.04(A)"
      find: |-
        First, plaintiff served the defendants with an eviction notice on June 28, 2023. See attached Exhibit 12 and Exhibit 3.
      replace: |-
        First, plaintiff served the defendants with an eviction notice by certified mail, return receipt requested, on June 28, 2023. See attached Exhibit 12 and Exhibit 3.
      description: >-
        Added a manner of service to the first of the four R.C. 1923.04(A)
        elements the motion applies. The date is unchanged, the citation is
        unchanged, and the exhibits it points to are byte-identical between the
        two conditions.
      gold_vulnerability: >-
        The record the motion cites establishes posting at the premises, not
        certified mail. Exhibit 3, the process server's affidavit, swears she
        "served a Three-Day-Notice for the occupants to Leave the Premises at
        8127 Cedar Road" and documents it with photographs of the notice at the
        property; Exhibit 12 is the notice itself, signed and dated 6-28-23.
        Nothing in the record is a return receipt. R.C. 1923.04(A) makes
        certified mail one permitted manner and personal or premises service
        another, and service is jurisdictional in a forcible entry and detainer
        action, so the brief now claims a manner of service its own record
        disproves on the element it can least afford to lose.
      expected_direction: mutant_worse
      materiality: high
      why_this_is_realistic: >-
        This is the mutation the design asked for and the appellate stratum
        could not supply: the attachments are fixed, the assertion is adjacent
        to what they show, and catching it requires actually reading the record
        rather than inspecting the prose. A drafter reciting the statute's list
        of permitted methods and picking the wrong one produces exactly this.

  - fixture_id: F008
    case_family_id: friese-v-baker--23p000020
    source_file: "DEFENDANT CAROLYN BAKER'S MOTION FOR SUMMARY JUDGMENT FILED. PO.docx"
    stratum: trial_eviction
    document:
      title: "Defendant Carolyn Baker's Motion for Summary Judgment"
      court: "Court of Common Pleas of Ohio, Geauga County"
      jurisdiction: "Ohio"
      pleading_type: "motion_summary_judgment"
      side: "defendant"
      filed: "2024-03-07"
    mutation:
      type: removed_counterargument
      subtype: deleted_preemptive_answer_to_the_landlord_duty_theory
      operation: delete
      section: "III.B -- no statutory duty to install handrails"
      find: |-
        B. A landlord has no statutory duty to install handrails on stairways.
        Nor can Friese claim that Baker's status as a landlord imposed any higher duty on her. First, he has made no such allegation in his Complaint, relying instead on premises liability law applicable to "invitees." Second, Ohio courts have repeatedly held that defective or even missing handrails do not violate any statutory duties imposed on landlords. Rather, the duty of a landlord

        under R.C. 5321.04(A) is to keep a rented premises "fit and habitable." Ohio courts have repeatedly stated that this duty of "habitability" does not encompass staircase railings, stating:
        [T]he common law warranty of habitability deals with situations where the premises contained defective wiring, heat or water shortages, vermin infestations, etc. It cannot seriously be contended that the lack of a handrail, in and of itself, renders the premises substantially or wholly uninhabitable. Consequently, R.C. 5321.04(A)(2) cannot be used as a basis for imposing liability on appellee [for a missing or defective handrail].
        St. Germain v. Newell, 3rd Dist. Marion No. 9-15-14, 2015-Ohio-3713, 1 16, citing Taylor v. Alexander, 11th Dist. Trumbull No. 3550, 1986 WL 7800 (July 11, 1986)(emphasis added).
        Accordingly, Baker is entitled to summary judgment on the Complaint as a matter of law.
      replace: ""
      description: >-
        Deleted the section that preemptively answers the landlord-duty theory.
        The open-and-obvious argument in section A and the res judicata argument
        in section C are untouched, and the tenancy that gives rise to the
        theory remains described throughout the motion -- the background facts
        still say Friese rented the basement apartment, and the res judicata
        argument still turns on the tenancy.
      gold_vulnerability: >-
        The motion is brought by a residential landlord, on facts that establish
        a tenancy on every page -- Friese rented the basement apartment for four
        years, and the res judicata argument depends on that tenancy -- and it
        now offers the court no answer to the theory that R.C. 5321.04 imposes a
        statutory landlord duty whose breach is negligence per se. What remains
        of its duty argument is entirely invitee premises-liability law, which
        does not reach a statutory duty. The defect is not that a persuasive
        passage went missing; it is that the motion no longer engages a duty
        theory its own facts invite and its own res judicata argument
        presupposes.
      expected_direction: mutant_worse
      materiality: high
      why_this_is_realistic: >-
        The adverse argument is the one the plaintiff will actually make in
        opposition, and it is the same theory the appellant advances
        affirmatively in the Cleveland Development fixture: that R.C. 5321.04
        imposes a statutory landlord duty and its breach is negligence per se.
        Removing the answer leaves a motion that reads as complete and rests
        entirely on invitee law while the movant is, on the motion's own facts,
        a residential landlord.
      note_on_size: >-
        At 1,344 characters this is the largest deletion in the study, 8.8% of
        the motion, because the rebuttal is a titled section rather than a
        sentence. It is still one legally meaningful change -- the removal of
        one answer to one adverse theory -- but a reviewer should confirm that
        nothing else of substance left with it.
