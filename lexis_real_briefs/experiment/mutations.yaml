# Authored mutations, one per fixture. One legally meaningful change, nothing else.
#
# `find` must match the normalized control exactly once; the builder refuses to
# write a fixture otherwise, so a mutation cannot silently land in the wrong
# place or in two places. `replace: ""` deletes.
#
# These were drafted by a language model (see REGISTER.md, "Who made what").
# None has been adjudicated by an attorney, so every fixture carries
# verification_status: unverified and none belongs in a held-out benchmark yet.

version: "1.0"

fixtures:

  - fixture_id: F001
    case_family_id: stone-v-cazeau--07ca009164
    source_file: "MERIT BRIEF OF APPELLANT.docx"
    stratum: appellate_eviction
    document:
      title: "Merit Brief of Appellant"
      court: "Court of Appeals of Ohio, Ninth District (Lorain County)"
      jurisdiction: "Ohio"
      pleading_type: "appellate_merit_brief"
      side: "appellant"
      filed: "2007-07-25"
    mutation:
      type: missing_element
      subtype: removed_status_element_for_statutory_protection
      operation: delete
      section: "Argument of Law -- Discussion"
      find: |-
        Alice Stone's status could change once Cazeau had expressed his "will" to end and no longer "suffer" her occupation. That is, her status would then become one of a tenant at sufferance. Sutherland v. Moore (Sept. 15, 1988), 10th Dist. No. 88AP-482.
      replace: ""
      description: >-
        Deleted the two sentences (and their supporting citation) that establish
        Stone's legal status as a tenant at sufferance once the owner revoked
        her permission to occupy. Everything else -- the R.C. 1923.02 and
        5321.15 discussion, the facts, the relief -- is untouched.
      gold_vulnerability: >-
        The brief concludes that Stone was entitled to the protections of R.C.
        Chapter 1923 without ever establishing the status that brings her within
        the statute. The immediately following sentences still assert that
        Chapter 1923 applies and that even a tenant at sufferance may be removed
        only by statutory process, so the argument now asserts the conclusion
        with the qualifying step removed.
      expected_direction: mutant_worse
      materiality: high
      why_this_is_realistic: >-
        The Ninth District affirmed against Stone on precisely this point, and
        the appellee's brief in the companion Lee matter argues the same gap.
        A drafter who omits the status step produces a brief that reads as
        complete and loses for a reason nothing in its own text names.

