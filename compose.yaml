services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env.azure
    environment:
      - VIRTUAL_HOST=${VIRTUAL_HOST:-cle-draft.lemmalegal.com}
      - LETSENCRYPT_HOST=${LETSENCRYPT_HOST:-cle-draft.lemmalegal.com}
    expose:
      - "80"
    volumes:
      - app_media:/app/media
      # Caselaw artifacts are no longer baked into the image; the deploy script
      # sideloads them here and the container reads them from the host.
      - ./private-content/caselaw-artifacts:/app/private-content/caselaw-artifacts

  nginx-proxy:
    image: nginxproxy/nginx-proxy:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - /var/run/docker.sock:/tmp/docker.sock:ro
    restart: unless-stopped

  acme-companion:
    image: nginxproxy/acme-companion
    environment:
      - DEFAULT_EMAIL=quinten@lemmalegal.com
      - NGINX_PROXY_CONTAINER=app-nginx-proxy-1
    volumes_from:
      - nginx-proxy
    volumes:
      - certs:/etc/nginx/certs
      - vhost:/etc/nginx/vhost.d
      - html:/usr/share/nginx/html
      - acme:/etc/acme.sh
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - nginx-proxy
    restart: unless-stopped

volumes:
  postgres_data:
  app_media:
  certs:
  vhost:
  html:
  acme:
